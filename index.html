<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#86D5FA">
<title>Bright Bible Play</title>
<style>
:root{--ink:#0F2A4A;--sky:#86D5FA;--sky2:#CFEFFF;--sun:#FFD21F;--sun2:#FFF1A8;--leaf:#8FD14F;--leaf2:#DDF4BE;--cream:#FFF6E5;--card:#FFFDF8;--red:#E5484D;--purple:#7B4FD0;--shadow:0 4px 0 rgba(15,42,74,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:0 16px 96px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.hero{background:linear-gradient(var(--sky),var(--sky2));margin:0 -16px 14px;padding:14px 16px 26px;border-radius:0 0 36px 36px;text-align:center;position:relative}
.hero h1{margin:4px 0 0;font-size:32px;letter-spacing:.2px}
.hero p{margin:2px 0 0;font-size:15px;opacity:.8}
h2{font-size:22px;margin:16px 0 10px}
.btn{display:block;width:100%;min-height:58px;border-radius:20px;background:var(--sun);font-weight:800;font-size:24px;box-shadow:var(--shadow);padding:10px 16px}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--leaf2);font-size:19px}
.btn.small{min-height:46px;font-size:17px;border-radius:16px}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;min-height:46px;border-radius:999px;background:var(--leaf2);font-weight:700;font-size:16px;border:3px solid transparent}
.chip.on{background:var(--sky);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;align-items:center;gap:10px;min-height:92px;font-weight:800;font-size:18px;line-height:1.15}
.card .ic{font-size:36px}
.card small{display:block;font-weight:600;font-size:13px;opacity:.7;margin-top:2px}
.plan{background:var(--leaf2);border-radius:22px;padding:16px;font-weight:800;font-size:20px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:8px;padding:12px 0}
.top h2{margin:0;flex:1;font-size:21px}
.ibtn{min-width:48px;min-height:48px;border-radius:16px;background:var(--card);font-size:22px;box-shadow:var(--shadow)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5}
nav div{max-width:560px;margin:0 auto;background:var(--card);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -4px 14px rgba(15,42,74,.1)}
nav button{flex:1;background:none;border-radius:18px;min-height:56px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .e{font-size:24px}
nav button.on{background:var(--sun2)}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;margin:8px 0}
.row>.btn{flex:1}
.msg{text-align:center;font-weight:800;font-size:20px;min-height:30px;margin:8px 0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
/* memory */
.mem{display:grid;gap:10px;margin:10px 0}
.mem button{aspect-ratio:1;border-radius:18px;background:var(--sky);font-size:40px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.mem button.up{background:#fff}
.mem button.ok{background:var(--leaf2);border-color:var(--leaf)}
/* word search */
.ws{display:grid;gap:3px;margin:8px auto;max-width:420px;touch-action:manipulation}
.ws button{aspect-ratio:1;background:#fff;border-radius:8px;font-weight:800;font-size:clamp(16px,5vw,24px);border:2px solid #d6e3ef;padding:0}
.ws button.start{background:var(--sun);border-color:var(--ink)}
.ws button.f0{background:#ffd0d0}.ws button.f1{background:#cfe8ff}.ws button.f2{background:#d9f5b8}.ws button.f3{background:#e6d6ff}.ws button.f4{background:#ffe9a8}.ws button.f5{background:#c9f3ee}.ws button.f6{background:#ffd6ec}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.words span{background:var(--sun2);padding:6px 12px;border-radius:999px;font-weight:800;font-size:16px}
.words span.found{background:var(--leaf2);text-decoration:line-through;opacity:.7}
/* maze */
.mazewrap{display:flex;justify-content:center}
.mazewrap svg{max-width:100%;height:auto;background:#fff;border-radius:16px;border:3px solid var(--ink);touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px;justify-content:center;margin:10px 0}
.dpad button{border-radius:18px;background:var(--sun);font-size:26px;box-shadow:var(--shadow)}
/* choices */
.choices{display:grid;gap:10px;margin:10px 0}
.choice{min-height:60px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:19px;padding:10px 14px;text-align:left;border:3px solid transparent}
.choice.ok{background:var(--leaf2);border-color:var(--leaf)}
.choice.bad{background:#ffd9d9;border-color:var(--red)}
.big{font-size:84px;text-align:center;margin:6px 0}
.q{font-size:22px;font-weight:800;text-align:center;margin:10px 0;line-height:1.25}
.verse{font-size:24px;line-height:1.9;text-align:center;font-weight:700}
.blank{display:inline-block;min-width:92px;border-bottom:4px dashed var(--ink);margin:0 4px;padding:0 6px;color:var(--purple)}
.blank.done{border-bottom-style:solid;color:var(--leaf);filter:brightness(.6)}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.bank button{background:var(--sky);border-radius:16px;min-height:52px;padding:8px 16px;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
.bank button:disabled{opacity:.3}
.built{min-height:70px;background:#fff;border-radius:18px;padding:10px;font-size:22px;font-weight:700;text-align:center;border:3px dashed var(--sky);margin:8px 0}
/* coloring */
.color svg{width:100%;height:auto;background:#fff;border-radius:16px;border:3px solid var(--ink)}
.color svg [data-r]{cursor:pointer}
.sw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.sw button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--ink)}
.sw button.on{box-shadow:0 0 0 4px var(--purple);transform:scale(1.1)}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(15,42,74,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .box{background:var(--card);border-radius:28px;padding:22px;text-align:center;max-width:380px;width:100%}
.ov .big{font-size:70px}
.ov h3{font-size:28px;margin:4px 0}
.ov .btn{margin-top:10px}
.muted{opacity:.7;font-size:15px}
.dayrow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:10px 12px;margin:8px 0;box-shadow:var(--shadow)}
.dayrow b{width:48px}
.dayrow span.t{flex:1;font-weight:700}
.dayrow button{background:var(--sun);border-radius:14px;min-height:44px;padding:0 16px;font-weight:800}
.dayrow.done{background:var(--leaf2)}
.foot{text-align:center;font-size:13px;opacity:.65;margin:18px 0}
@media print{nav,.noprint,.top .ibtn{display:none!important}body{background:#fff}main{padding:0}.hero{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="print.js"></script>
</body>
</html>
